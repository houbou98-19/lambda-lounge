AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: lambda-lounge - serverless chat on API Gateway, Lambda and DynamoDB

Parameters:
  AlertEmail:
    Type: String
    Default: ''
    Description: Where alarm and budget emails go. Leave empty to skip them

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Globals:
  Function:
    Runtime: python3.12
    CodeUri: .
    MemorySize: 256
    Timeout: 30
    Tracing: Active
    PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/lambda-lounge-boundary

Resources:
  ChatApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: lambda-lounge-api
      StageName: Prod
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: /*
          HttpMethod: '*'
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
      Cors:
        AllowOrigin: '''*'''
        AllowMethods: '''GET,POST,OPTIONS'''

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH

  MessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      AttributeDefinitions:
        - AttributeName: room
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: room
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE

  StatsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /lambda-lounge/api
      RetentionInDays: 14

  WorkersLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /lambda-lounge/workers
      RetentionInDays: 14

  ChatApi:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.lambda_handler
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        LogGroup: !Ref ApiLogGroup
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
        - DynamoDBReadPolicy:
            TableName: !Ref StatsTable
        - SSMParameterReadPolicy:
            ParameterName: lambda-lounge/secret-key
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          MESSAGES_TABLE: !Ref MessagesTable
          STATS_TABLE: !Ref StatsTable
          SECRET_PARAMETER: /lambda-lounge/secret-key
      Events:
        ApiGateway:
          Type: Api
          Properties:
            RestApiId: !Ref ChatApiGateway
            Path: /{proxy+}
            Method: ANY

  # New messages -> stream -> StreamProcessor -> event bus -> queue -> StatsConsumer -> stats table
  MessageBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub ${AWS::StackName}-bus

  StreamProcessor:
    Type: AWS::Serverless::Function
    Properties:
      Handler: workers.stream_processor.lambda_handler
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        LogGroup: !Ref WorkersLogGroup
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref MessageBus
      Environment:
        Variables:
          EVENT_BUS: !Ref MessageBus
      Events:
        MessagesStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt MessagesTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumRetryAttempts: 3
            BisectBatchOnFunctionError: true

  MessageEventsDlq:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  MessageEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt MessageEventsDlq.Arn
        maxReceiveCount: 3

  MessagePostedRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref MessageBus
      EventPattern:
        source:
          - lambda-lounge.chat
        detail-type:
          - MessagePosted
      Targets:
        - Id: message-events-queue
          Arn: !GetAtt MessageEventsQueue.Arn

  MessageEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref MessageEventsQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt MessageEventsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt MessagePostedRule.Arn

  StatsConsumer:
    Type: AWS::Serverless::Function
    Properties:
      Handler: workers.stats_consumer.lambda_handler
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        LogGroup: !Ref WorkersLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StatsTable
      Environment:
        Variables:
          STATS_TABLE: !Ref StatsTable
      Events:
        MessageEvents:
          Type: SQS
          Properties:
            Queue: !GetAtt MessageEventsQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  AlertTopic:
    Type: AWS::SNS::Topic

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The Lambda function threw an error
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ChatApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The API returned 5xx responses
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: lambda-lounge-api
        - Name: Stage
          Value: Prod
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  SlowRequestsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: 95% of requests are taking more than 10 seconds
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref ChatApi
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  DeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Message events could not be processed and ended up in the dead letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt MessageEventsDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasAlertEmail
    Properties:
      Budget:
        BudgetName: lambda-lounge-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 5
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  ApiUrl:
    Description: API Gateway URL for the Chat App
    Value: !Sub https://${ChatApiGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod/login
