<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lambda-lounge | login</title>
    <link rel="stylesheet" href="static/style.css">
    <script src="static/script.js" defer></script>
</head>
<body>
    <main class="terminal login">
        <header>
            <h1>&lambda; lambda-lounge<span class="cursor"></span></h1>
            <p class="subtitle">a serverless chat on aws</p>
        </header>

        <p id="auth-message" class="auth-message" role="alert" hidden></p>

        <section id="login-section">
            <h2>login</h2>
            <form id="login-form">
                <div class="field">
                    <label for="login-username">username</label>
                    <input type="text" id="login-username" autocomplete="username" required autofocus>
                </div>
                <div class="field">
                    <label for="login-password">password</label>
                    <input type="password" id="login-password" autocomplete="current-password" required>
                </div>
                <button type="submit">login</button>
            </form>
            <p class="switch">no account yet? <button type="button" class="link" id="show-register">register</button></p>
        </section>

        <section id="register-section" hidden>
            <h2>register</h2>
            <form id="register-form">
                <div class="field">
                    <label for="register-username">username</label>
                    <input type="text" id="register-username" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="register-password">password</label>
                    <input type="password" id="register-password" autocomplete="new-password" required>
                </div>
                <button type="submit">create account</button>
            </form>
            <p class="switch">already have an account? <button type="button" class="link" id="show-login">login</button></p>
        </section>
    </main>
</body>
</html>
