<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/style.css">
    <title>lambda-lounge</title>
    <script src="static/script.js" defer></script>
</head>
<body>
    <main class="terminal chat">
        <header class="chat-header">
            <h1>&lambda; lambda-lounge<span class="cursor"></span></h1>
            <span id="status" class="status">connecting</span>
            <button id="logout-btn" type="button">logout</button>
        </header>
        <div id="messages" role="log" aria-live="polite">loading messages...</div>
        <form id="message-form">
            <span class="prompt">&gt;</span>
            <input type="text" id="message" placeholder="type a message" autocomplete="off" required>
            <button type="submit">send</button>
        </form>
    </main>
</body>
</html>
