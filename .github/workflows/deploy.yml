name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: write
  contents: write

concurrency: deploy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/setup-sam@v3
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Create the secret for the access tokens if it is missing
        run: |
          aws ssm get-parameter --name /lambda-lounge/secret-key > /dev/null 2>&1 || \
          aws ssm put-parameter --name /lambda-lounge/secret-key --type SecureString --value "$(openssl rand -base64 48)"

      - run: sam build --use-container
      - name: Deploy
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          CUSTOM_DOMAIN_CERT_ARN: ${{ vars.CUSTOM_DOMAIN_CERT_ARN }}
        run: |
          PARAMS=""
          if [ -n "$ALERT_EMAIL" ]; then
            PARAMS="$PARAMS AlertEmail=$ALERT_EMAIL"
          fi
          if [ -n "$CUSTOM_DOMAIN" ] && [ -n "$CUSTOM_DOMAIN_CERT_ARN" ]; then
            PARAMS="$PARAMS DomainName=$CUSTOM_DOMAIN CertificateArn=$CUSTOM_DOMAIN_CERT_ARN"
          fi
          sam deploy --stack-name lambda-lounge --resolve-s3 --capabilities CAPABILITY_IAM --no-confirm-changeset --no-fail-on-empty-changeset \
            ${PARAMS:+--parameter-overrides $PARAMS}

      - name: Put the api url in the README
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name lambda-lounge --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          sed -i "s|^Live demo: .*|Live demo: $URL|" README.md
          if ! git diff --quiet; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git commit -am "Update api url [skip ci]"
            git push || echo "Could not push to main (it is protected), update the api url in the README by hand"
          fi
